[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
addopts = -ra --tb=short --strict-markers -m "not integration and not quality"
markers =
    slow: тесты которые делают I/O или большие LLM-вызовы
    integration: end-to-end интеграционные тесты с реальным LLM
    quality: LLM-as-judge тесты качества (дорого по токенам)
