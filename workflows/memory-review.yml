# Память раз в полчаса (SAM-94): основная модель сама просматривает услышанное и пишет важное в память SAM.
# Ворота: фразы людей после прошлого срабатывания и после последней записи в память - нет новых, модель не зовётся.
# Что не сохранять - по Hermes Agent agent/background_review.py:375-438.
name: memory-review
category: memory
tags: [llm]
on:
  schedule:
    every: 30m
gate: received_since_memory
steps:
  - name: review
    main_model: |
      Проверка памяти раз в полчаса. Ниже - что ты услышала с прошлой проверки, в том числе разговор не к тебе.
      Шаги:
      1. Было ли важное? Важное - то, что пригодится позже: факты о людях дома и о доме, даты и дни рождения,
         планы и договорённости, предпочтения, здоровье, новые люди, питомцы и устройства, просьба «запомни».
      2. Есть ли это уже в памяти SAM? Поищи по сути факта (list_memories).
      3. Нашла - пропусти. Есть, но устарело - поправь (update_memory). Нет - сохрани (remember): один факт одной
         записью, с тем, кто сказал и когда.
      Не сохраняй:
      - болтовню, разовые просьбы и пересказ того, что сейчас делали;
      - сбои среды и временные ошибки (нет программы, упал сервис, не нашёлся файл) - их чинят, правилом они не становятся;
      - утверждения «инструмент X не работает» - они переживают починку и потом мешают;
      - то, что уже есть в памяти, второй записью.
      Это не реплика человека: в любом случае ответ - один <silent></silent>, и когда важного нет.
