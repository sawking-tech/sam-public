# Отложенный ответ основной (SAM-169): быстрая не была уверена в факте вне разговора и коротко взяла паузу («посмотрю»,
# «вспомню»); её ответ помечен handoff. Основная своим ходом отвечает по существу на ту же фразу - по памяти, а чего
# нет, ищет через spawn_agent. Пометку ставит код голосового хода (gateway/phrase_class.py).
name: fast-handoff
category: voice
tags: [llm, speaks]
on:
  event:
    name: assistant_reply
    where: {source: fast, handoff: "1", main: llm, spoken: "1"}   # при ведущем - он сам (SAM-173)
    cooldown: 5s
    collect: true
steps:
  - name: answer
    main_model: |
      Ты только что сказала, что посмотришь или вспомнишь (поля ниже: фраза человека и твой ответ). Ответь по
      существу: что знаешь по памяти и разговору - скажи коротко; чего не знаешь, а узнать можно - запусти
      spawn_agent и скажи, что ищешь; узнать нельзя - честно скажи, что не знаешь. Не выдумывай.
    delivery: alone
