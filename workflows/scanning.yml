# Сканирование (radar-in-sam): заполняет пробелы в сводке дня - SAM не знает, где человек или что он делает, а для сводки это важно.
# Ворота-команда gateway/scanning.py: услышанное о положении и вопрос человеку, потом его партнёру; пустой вывод - модель не зовётся.
# Выключено по умолчанию: SAM_SCANNING=1 включает. Частота, ожидание, порог уверенности и ночь - SAM_SCANNING_* (gateway/scanning.py).
name: scanning
category: radar
tags: [proactive, speaks, llm]
on:
  schedule:
    every: 5m
gate:
  command: python -m gateway.scanning
steps:
  - name: scan
    main_model: |
      Сканирование: ты заполняешь пробел в сводке дня - где человек и что делает; радар твоё зрение по дому (скилл radar).
      В поводе ниже бывает две части.
      1. «Услышано о положении»: в каждой фразе, где человек сказал, где он или что делает, или где другой человек,
         внеси это в радар: radar_layout, затем radar_tell с именем места из разметки. Только сказанное прямо,
         без выводов и догадок; место не совпало с разметкой - не вноси. Об этом в ответе ничего не пиши.
      2. «Вопрос»: скажи одну короткую живую фразу тому, кого назвал повод, по имени, без объяснений, зачем спрашиваешь.
      Вопроса в поводе нет - ответ один <silent></silent>.
