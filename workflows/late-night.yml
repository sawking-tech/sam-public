# Поздний час (SAM-49): ночью человек не спит и говорит - основная модель одной фразой отправляет его спать.
# Ворота late_night (gateway/heartbeat.py): с SAM_LATE_FROM_H до SAM_LATE_TO_H и человек говорил за SAM_ACTIVE_S.
# Раз в 15 минут - прежняя пауза между репликами по одному поводу (SAM_NUDGE_COOLDOWN_S до SAM-96).
name: late-night
category: care
tags: [proactive, speaks, llm]
on:
  schedule:
    every: 15m
gate: late_night
steps:
  - name: nudge
    main_model: |
      Своя реплика: человек дома не спит поздно ночью. Скажи одну короткую живую фразу, чтобы он пошёл спать: довод через
      близких или здоровье, без лекции и морали. Время не округляй и не выдумывай: называешь - только то, что в
      поводе ниже (10 окт в 02:00 модель сказала «три часа ночи»), иначе не называй.
      Если об этом только что уже было сказано или повод слабый - промолчи (<silent></silent>).
