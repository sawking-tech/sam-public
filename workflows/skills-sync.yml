# Скиллы стенда в памяти SAM: раз в 10 минут sync_skills перечитывает .claude/skills и сверяет с памятью - новый
# скилл запоминается (описание и команда), изменённый переписывается с новым эмбеддингом, удалённый забывается.
# Без изменений вызов ничего не пишет; модель не зовётся.
name: skills-sync
category: skills
tags: [service]
on:
  schedule:
    every: 10m
steps:
  - name: sync
    tool: sync_skills
