# Проверка ответов быстрой модели основной (SAM-166, ADR-014): быстрый голос - агент с правом быть озвученным, его
# ответ (assistant_reply, source fast) запускает проверку. Одиночный ответ проверяется сразу, поток ответов
# склеивается пачкой (collect). Проверка видит разговор и заметки основной о нём (dialogue_context, SAM-131).
# Верно - тишина, неполный, но верный - тоже тишина; неверно - поправка: на один ответ отзывает его, на пачку звучит в
# паузе.
name: fast-review
category: voice
tags: [llm, speaks]
on:
  event:
    name: assistant_reply
    where: {source: fast, main: llm, spoken: "1", handoff: "0"}   # при ведущем ответ быстрой получает он сам (SAM-173)
    cooldown: 5s
    collect: true
steps:
  - name: context
    tool: dialogue_context
  - name: check
    ask: |
      Ниже - твои быстрые ответы людям дома: на какую фразу (phrase) и что ты ответила (voice), по одному на строку,
      а после них - разговор и твои заметки о нём. Проверь ответы по смыслу и по разговору. Все верны, или ошибка в болтовне ничего не меняет, - ответь ровно OK.
      Неполный, но верный ответ - тоже OK: не дополняй и не уточняй за человека, пока он сам не переспросил, - люди
      так и разговаривают, подробности по просьбе. Переспросил - отвечает та же быстрая по заметкам и заготовкам; её
      ответ без лжи - тоже OK, вмешиваться не надо.
      Есть неверный ответ или выдумано сделанное - ответь одной поправкой от первого лица, одна-две фразы, без
      упоминания моделей и проверки. Ответ один и он бред, но человеку от него ни холодно ни жарко (ответ на обрывок,
      не к тебе) - ответь ровно DROP: он уйдёт из разговора без поправки вслух. Ответов несколько - DROP не пиши. Ответов больше одного - назови, что поправляешь («кстати, про будильник я
      ошиблась: ...»). Обещанное действие без запуска (reply_class action_unbacked) не поправляй: его доводит
      отдельный workflow fast-action. Ответ с пометкой handoff - пауза до ответа по существу (fast-handoff): если он
      ничего не выдумал, он верен.

      {{reason}}

      {{context}}
  - name: fix
    tool: amend_reply
    with: {text: "{{check}}", count: "{{count}}", phrase: "{{event.phrase}}", reply: "{{event.voice}}"}
    if: check != OK
