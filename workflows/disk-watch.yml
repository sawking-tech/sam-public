# Надзор за диском (SAM-107): раз в полчаса снимок свободного места дисков стенда и повод, если места мало или оно быстро падает.
# Ворота-команда gateway/disk_watch.py: пустой вывод - модель не зовётся; тот же вывод, что в прошлый раз, тоже не повод.
# Пороги: SAM_DISK_MIN_FREE_GB, SAM_DISK_DROP_GB, SAM_DISK_DROP_WINDOW_H; диски: SAM_DISK_DRIVES.
name: disk-watch
category: stand
tags: [proactive, speaks, llm]
on:
  schedule:
    every: 30m
gate:
  command: python -m gateway.disk_watch
steps:
  - name: tell
    main_model: |
      Надзор за диском сработал: места на диске стенда мало или оно быстро уходит (повод ниже).
      Скажи вслух одной-двумя короткими фразами: какой диск и сколько свободно. Предложи конкретный шаг из двух:
      запустить scripts/docker_hygiene.ps1 (чистка Docker, без удаления данных) и scripts/free_c_disk.ps1 (показ, что можно
      убрать), удалять без его прямого слова ничего не будешь. Время не называй. Если об этом уже говорила за последний час,
      промолчи (<silent></silent>).
