# Действие, обещанное быстрой моделью без запуска (SAM-166, прежде chatter.py): быстрая сказала «включила», «запишу»,
# а spawn_agent не вызвала (reply_class action_unbacked). Основная модель своим ходом запускает действие или говорит,
# что не сделала. Класс ответа решает код в голосовом ходе, ворота и модель для отбора не нужны.
name: fast-action
category: voice
tags: [llm, speaks]
on:
  event:
    name: assistant_reply
    where: {source: fast, reply_class: action_unbacked, main: llm, spoken: "1"}   # при ведущем - он сам (SAM-173)
    cooldown: 5s
steps:
  - name: act
    main_model: |
      Ты только что пообещала голосом действие, но не запустила его (поля ниже: фраза человека и твой ответ).
      Нужно действие на устройстве или поиск - запусти spawn_agent сейчас и коротко скажи, что делаешь.
      Действие не нужно или его нельзя сделать - одной фразой поправься, что не сделала.
    delivery: alone
