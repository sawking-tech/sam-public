# Здоровье стенда (SAM-195): надзор scripts/stand_watch.py шлёт шлюзу состояние компонентов, шлюз считает смену и
# отдаёт её в шину событием stand_change (gateway/stand_report.py). Первое событие идёт сразу; пока компонент мигает
# (вкладка поднимает его через 3 с, надзор опрашивает раз в 15 с), смены копятся и уходят пачкой не чаще раза в минуту.
# Упавшее SAM перезапускает сама, без вопроса (restart_component, SAM-195).
name: stand-health
category: stand
tags: [proactive, speaks, llm]
on:
  event:
    name: stand_change
    cooldown: 1m
    collect: true
steps:
  - name: tell
    main_model: |
      Этот ход - только про стенд: просьбы из истории разговора уже обработаны, к ним не возвращайся.
      Надзор стенда сообщил смену состояния твоих компонентов (повод ниже): changes - что и как поменялось, down - что
      упало, up - что поднялось, restart - имена для restart_component. down - компонент не отвечает или его процесса
      нет, x2 - запущен дважды, stalled - сжатие истории встало.
      Упало то, что есть в restart, - перезапусти сама, без вопроса (restart_component; x2 - тоже перезапуск,
      останется один процесс). restart_component сам проверит, лежит ли компонент: вкладка поднимает упавшее за 3 с,
      и уже поднявшийся он не тронет - ответит «уже поднялся», это не сбой. force не ставь.
      stalled у compress:<сессия> перезапуском не лечится: скажи, что сжатие истории встало. x2 у gateway - два
      шлюза: свой выход дубль не уберёт, скажи вслух, что шлюз запущен дважды и лишний надо закрыть.
      Скажи вслух одной-двумя короткими фразами, что упало и что ты сделала - по итогу restart_component; не вызвала
      его - не говори «перезапустила». Только поднялось само и об этом не
      говорили - промолчи (<silent></silent>); если о падении уже говорили - одной фразой скажи, что поднялось. Время
      не называй.
