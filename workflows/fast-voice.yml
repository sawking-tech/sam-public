# Отвечает ли быстрая модель на фразу (ADR-020, п. 11; ADR-014): голосовой ход спрашивает этот workflow в точке
# выбора модели. Ворота пусты - noop, отвечает основная: первые ходы после холодного старта (у быстрой ещё нет
# контекста разговора, SAM_FAST_COLD_TURNS) и откат после поправок основной (SAM-168). Выключенный файл - быстрая
# отвечает всегда, когда настроена.
name: fast-voice
category: voice
tags: [llm]
on:
  consult: fast_voice
gate: fast_voice_ready
