# Заметки основной модели о разговоре (SAM-131): после фраз голосовой сессии основная обновляет для себя тему, линию
# разговора, прогноз и заготовки. Быстрая модель читает их в контексте хода и отвечает по линии разговора, а не по
# обрывку; проверка её ответов сверяется с ними. Частые фразы склеиваются: обновление не чаще паузы cooldown.
name: dialogue-notes
category: voice
tags: [llm, service]
on:
  event:
    name: user_message
    where: {session: voice, accepted: "1"}   # фон и «не мне» не считаются разговором (ревью 12 окт)
    cooldown: 20s
    collect: true
steps:
  - name: context
    tool: dialogue_context
  - name: notes
    ask: |
      Ты ведёшь для себя заметки о разговоре дома. Ниже - последние реплики, твоя недавняя работа и прежние заметки.
      Обнови их кратко, по фразе на поле: о чём сейчас разговор, куда он идёт, что вероятно будет дальше. В digest -
      выжимка нужного по теме для быстрого голоса: что из твоей работы, памяти и навыков пригодится в ответах. Заметки
      читает быстрый голос, поэтому во всех полях - без секретов и без личного, сказанного по секрету. Если тема резко сменилась и линию надо строить заново, поставь
      rebuilding: true - пока он стоит, отвечаешь ты сама, а не быстрый голос.
      И разыграй 3-4 ближайших хода беседы: кто из участников что вероятно скажет или спросит и какой короткий ответ
      ты могла бы дать; реплика и ответ - до 15 слов, иначе ответ не помещается в предел.
      Бред распознавателя и обрывки не считай темой.
      Ответь только JSON: {"topic": "...", "line": "...", "forecast": "...", "digest": "...", "rebuilding": false,
      "branches": [{"who": "имя", "says": "...", "reply": "..."}]}

      {{context}}
  - name: save
    tool: update_dialogue_notes
    with: {notes: "{{notes}}"}
